[workspace]
members = ["crates/core", "crates/devkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"
repository = "https://github.com/karad/yuge-hasi-dev"
homepage = "https://github.com/karad/yuge-hasi-dev"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
